<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>プラトーケアセンター大桑店分室 パンフレット</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      background: #f3f5f2;
      color: #17382e;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-width: 0;
      background: #f3f5f2;
    }

    body { padding: clamp(8px, 2vw, 24px); }

    main {
      width: min(100%, 1400px);
      margin: 0 auto;
    }

    h1 {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .page {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 0 clamp(12px, 2vw, 24px);
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 8px 24px rgba(23, 56, 46, .12);
    }

    .download {
      display: flex;
      justify-content: center;
      padding: 4px 0 16px;
    }

    .download a {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      border-radius: 999px;
      background: #176b50;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      text-decoration: none;
    }

    .download a:focus-visible {
      outline: 3px solid #f0a12b;
      outline-offset: 3px;
    }

    @media (max-width: 520px) {
      body { padding: 8px; }
      .page { border-radius: 6px; box-shadow: 0 4px 12px rgba(23, 56, 46, .12); }
    }
  </style>
</head>
<body>
  <main>
    <h1>プラトーケアセンター大桑店分室 パンフレット</h1>
    <img class="page" src="pamphlet-1.png" alt="大桑店分室パンフレット 外側" width="1754" height="1240">
    <img class="page" src="pamphlet-2.png" alt="大桑店分室パンフレット 内側" width="1754" height="1240" loading="lazy">
    <div class="download">
      <a href="pamphlet.pdf" target="_blank" rel="noopener">PDFで開く</a>
    </div>
  </main>
</body>
</html>
